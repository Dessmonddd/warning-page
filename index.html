<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You've been scammed!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">

    <style>
        /* Basic reset and page setup */
        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            height: 100vh;
            background-color: #f6785f;
            /* Background color from the image */
            font-family: 'Poppins', sans-serif;
        }

        #enter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f6785f;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            color: #fdc79c;
            font-size: 2rem;
            text-align: center;
        }
        
        /* The main content starts hidden --- */
        .main-content {
            display: none; /* Starts hidden */
            height: 100%;
            width: 100%;
            justify-content: center;
            align-items: center;
        }
    
        /* The main container box */
        .scam-container {
            background-color: #fdc79c;
            /* Container color from the image */
            padding: 40px 50px;
            border-radius: 30px;
            text-align: center;
            max-width: 90%;
            width: 700px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
    
        /* Warning Icon (SVG) */
        .warning-icon {
            width: 100px;
            height: auto;
            margin-bottom: 15px;
        }
    
        /* Main headline text */
        .scam-title {
            font-family: 'Times New Roman', Times, serif;
            color: #1e293b;
            /* Dark text color from the image */
            font-size: 3.5rem;
            margin: 10px 0 25px 0;
            padding-bottom: 20px;
        }
    
        /* "Learn More" button */
        .learn-more-btn {
            background-color: #a02d45;
            /* Button color from the image */
            color: white;
            border: none;
            padding: 16px 38px;
            font-family: "Times New Roman", Times, serif;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            border-radius: 50px;
            /* Fully rounded corners */
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-decoration: none;
        }
    
        /* Hover effect for the button */
        .learn-more-btn:hover {
            background-color: #8a3443;
            transform: scale(1.05);
        }
    
        /* Responsive adjustments for smaller screens */
        @media (max-width: 600px) {
            .scam-title {
                font-size: 2.5rem;
            }
    
            .scam-container {
                padding: 30px 25px;
            }
    
            .warning-icon {
                width: 80px;
            }
    
            .learn-more-btn {
                padding: 14px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- The overlay that the user sees first -->
    <div id="enter-overlay">
        <h1>Click anywhere to continue</h1>
    </div>

    <!-- The real content, hidden at first -->
    <div id="main-content" class="main-content">
        <div class="scam-container">
            <svg class="warning-icon" viewBox="0 0 100 100" aria-hidden="true">
                <path d="M50 10 L90 85 H10 Z" fill="#fff"></path>
                <path d="M50 10 L90 85 H10 Z" fill="none" stroke="#d7263d" stroke-width="8" stroke-linejoin="round">
                </path>
                <rect x="46" y="34" width="8" height="26" rx="2" fill="#1e1f26"></rect>
                <circle cx="50" cy="70" r="5" fill="#1e1f26"></circle>
            </svg>
            <h1 class="scam-title">You've been scammed!</h1>
            <a href="learn-more.html" class="learn-more-btn">Learn More</a>
        </div>
    </div>

    <!-- Audio tag with NO autoplay. It will be controlled by JavaScript. -->
    <audio id="background-music" src="alarm.mp3" loop></audio>

    <script>
        // Get all the elements we need
        const overlay = document.getElementById('enter-overlay');
        const mainContent = document.getElementById('main-content');
        const music = document.getElementById('background-music');

        // Listen for a single click on the overlay
        overlay.addEventListener('click', () => {
            // Hide the overlay
            overlay.style.display = 'none';

            // Show the real content (using flex to center it)
            mainContent.style.display = 'flex';

            // Play the music. This is allowed because it's triggered by a user click.
            // The .catch() is good practice to prevent console errors if play() fails.
            music.play().catch(error => {
                console.log("Audio play failed: ", error);
            });
        }, { once: true }); // { once: true } makes the event listener run only one time
    </script>

</body>

</html>
